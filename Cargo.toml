[workspace]
resolver = "3"
members = ["benches", "crates/*", "src-tauri"]
# Extensions build for wasm32 in their own workspace.
exclude = ["extensions"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
flareite-core = { path = "crates/flareite-core" }
flareite-diff = { path = "crates/flareite-diff" }
flareite-extension-host = { path = "crates/flareite-extension-host" }
flareite-extension-install = { path = "crates/flareite-extension-install" }
flareite-lsp = { path = "crates/flareite-lsp" }
flareite-process = { path = "crates/flareite-process" }
flareite-schema = { path = "crates/flareite-schema" }
flareite-schema-document = { path = "crates/flareite-schema-document" }
flareite-syntax = { path = "crates/flareite-syntax" }
flareite-tasks = { path = "crates/flareite-tasks" }
flareite-terminal = { path = "crates/flareite-terminal" }
flareite-text = { path = "crates/flareite-text" }
flareite-workspace = { path = "crates/flareite-workspace" }

base64 = "0.23.1"
# Guesses the encoding of text files that aren't UTF-8, for encoding_rs.
chardetng = "1.0.0"
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
  "html_reports",
  "plotters",
] }
encoding_rs = "0.8.42"
# Webview page tokens. The version the tree already has.
getrandom = "0.4.3"
globset = "0.4.20"
# Line and character diffs for the diff editor.
imara-diff = "0.2.0"
# Extensions' secrets in the system's credential store (API 1.17). Each
# platform's store is a feature, chosen in src-tauri/Cargo.toml.
keyring = { version = "3.6.3", default-features = false }
# JSON Schema validation (flareite-schema), without its own HTTP and file
# retrieval.
jsonschema = { version = "0.61.0", default-features = false }
lsp-types = "0.97.0"
ignore = "0.4.33"
memory-stats = "1.2.0"
notify-debouncer-mini = "0.7.0"
open = "5.4.5"
nucleo-matcher = "0.3.1"
portable-pty = "0.9.0"
# TOML Schema patterns (the vendored reference implementation).
regex = "1.13.1"
regex-automata = "0.4.18"
# YAML documents, for schemas: an event parser with where each value is.
saphyr-parser = "0.3.3"
# Installing extensions from GitHub. The version Tauri already uses, with
# rustls and the operating system's certificates.
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
  "system-proxy",
] }
regex-cursor = "0.1.5"
regex-syntax = "0.8.11"
semver = "1.0.28"
toml = "1.1.8"
toml_edit = "0.25.17"
# Only LF, CR and CRLF break lines (matching LSP), not Unicode line separators.
rustix = { version = "1.1.5", features = ["process"] }
ropey = { version = "1.6.1", default-features = false, features = [
  "cr_lines",
  "simd",
] }
streaming-iterator = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
# `unstable`: child webviews, for web page panes (src-tauri/src/web_pages.rs).
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-build = { version = "2.7.4", features = [] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
# Flareite updating itself from its GitHub releases, signed (ADR 0040).
tauri-plugin-updater = "2.14.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
# The same version as the Markdown extension's, whose renderer the
# extension host compiles in for READMEs.
pulldown-cmark = { version = "0.13", default-features = false }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
tracing = "0.1.44"
# `wasm` loads grammars that extensions contribute as WebAssembly. It runs
# them on the wasmtime below, so the two versions must match.
tree-sitter = { version = "0.27.1", features = ["wasm"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13.3"
# TOML Schema locations. The version the tree already has.
url = "2.5.8"
# Only what extensions need: compiling and running components. No WASI,
# GC, threads, or async. Pinned to the major version tree-sitter's `wasm`
# feature uses (see above), so there is one wasmtime; 48.0.8 has the same
# security fixes as 50.0.1.
wasmtime = { version = "48.0.8", default-features = false, features = [
  "anyhow",
  "component-model",
  "cranelift",
  "parallel-compilation",
  "runtime",
  "std",
] }
wat = "1.262.0"
# Job objects without unsafe code, so stopping a language server stops
# everything it started.
win32job = "2.0.3"
# The version Tauri already uses.
windows-version = "0.1.7"
wit-component = { version = "0.262.0", default-features = false }
# Extension packages: reading (and, in tests, writing) deflated zip files.
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
