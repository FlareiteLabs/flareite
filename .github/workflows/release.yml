# Publishes Flareite when a version tag is pushed (git tag v0.2.0 && git push
# origin v0.2.0). The tag's major.minor.patch must match the version in
# Cargo.toml and package.json. A tag with a prerelease after it
# (v0.2.0-alpha.1) is published as a prerelease of that version: the
# manifests keep 0.2.0, so the app reports 0.2.0, and extensions that
# require >=0.2.0 run in it (semver puts 0.2.0-alpha.1 before 0.2.0).
#
# 1. CI runs on the tagged commit (the whole of ci.yml).
# 2. A draft release is created, with notes generated from the commits.
# 3. Each platform builds and uploads its installers to the draft:
#    Windows (.msi and .exe), macOS (a universal .dmg and .app.tar.gz), and
#    Linux (.deb, .rpm, and .AppImage). Each installer gets a .sig beside it,
#    and the app is built knowing its tag (FLAREITE_RELEASE_TAG).
# 4. Once all have, the update manifest (latest.json) is made from the
#    signatures and added, and the release is published. If any step fails,
#    the draft stays, to look into and delete before tagging again.
#
# Installed Flareite updates itself from these releases (ADR 0040), and
# installs only installers signed with the updater key, whose public half is
# in tauri.conf.json. The private key is the TAURI_SIGNING_PRIVATE_KEY
# secret (with TAURI_SIGNING_PRIVATE_KEY_PASSWORD, empty if it has none).
# Without it, the release stops before building.
#
# The installers aren't code-signed: Windows SmartScreen and macOS
# Gatekeeper warn before opening them (see the README).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the updater key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret isn't set, so the installers can't be signed for updates (see the top of release.yml)."
            exit 1
          fi
      - id: check
        run: |
          set -euo pipefail
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          node=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          # v0.2.0-alpha.1 releases 0.2.0's code as a prerelease.
          base="${tag%%[-+]*}"
          if [ "$base" != "$cargo" ] || [ "$node" != "$cargo" ]; then
            echo "::error::The tag $GITHUB_REF_NAME must be v$cargo, or a prerelease of it (v$cargo-alpha.1), to match Cargo.toml ($cargo) and package.json ($node)."
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  draft:
    name: Draft the release
    needs: [version, ci]
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Flareite $GITHUB_REF_NAME" \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            -F generate_release_notes=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [version, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            targets: ''
            args: ''
          - name: macOS
            os: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # The oldest supported Ubuntu, so the packages run on as many
          # distributions as they can.
          - name: Linux
            os: ubuntu-22.04
            targets: ''
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the frontend (beforeBuildCommand) and the app, bundles it,
      # signs the installers for the updater (tauri.release.conf.json), and
      # uploads them and their signatures to the draft. The publish job makes
      # the update manifest, so this doesn't.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled in (src-tauri/src/app_update.rs): which releases are newer.
          FLAREITE_RELEASE_TAG: ${{ github.ref_name }}
          FLAREITE_RELEASE_REPOSITORY: ${{ github.repository }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: false

  publish:
    name: Publish the release
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # From every installer's signature (scripts/updater-manifest.mjs). A
      # draft has no tag to address it by yet, so its id is used.
      - name: Add the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.draft.outputs.id }}
        run: |
          set -euo pipefail
          mkdir signatures
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" \
            --jq '.assets[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r asset name; do
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "signatures/$name"
            done
          node scripts/updater-manifest.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" signatures > latest.json
          cat latest.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=latest.json" > /dev/null
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.draft.outputs.id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false
