[package]
name = "flareite-app"
description = "Flareite desktop application: lifecycle, dependency wiring, and the Tauri command boundary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "flareite"

[[bin]]
name = "flareite"
path = "src/main.rs"

[lib]
name = "flareite_app"

[build-dependencies]
sha2 = { workspace = true }
tauri-build = { workspace = true }

[dependencies]
flareite-core = { workspace = true }
flareite-diff = { workspace = true }
flareite-extension-host = { workspace = true }
flareite-extension-install = { workspace = true }
flareite-lsp = { workspace = true }
flareite-schema = { workspace = true }
flareite-syntax = { workspace = true }
flareite-tasks = { workspace = true }
flareite-terminal = { workspace = true }
flareite-text = { workspace = true }
flareite-workspace = { workspace = true }
globset = { workspace = true }
memory-stats = { workspace = true }
open = { workspace = true }
# Downloading schemas (schemas/fetch.rs).
reqwest = { workspace = true }
sha2 = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }


[lints]
workspace = true
