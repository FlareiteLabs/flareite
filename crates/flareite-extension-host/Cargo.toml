[package]
name = "flareite-extension-host"
description = "Loads and runs WASM extensions: manifests, permissions, lifecycle, limits, and the host side of the extension API."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = { workspace = true }
flareite-core = { workspace = true }
flareite-process = { workspace = true }
# Checking the schemas extensions set (API 1.16).
flareite-schema = { workspace = true }
flareite-text = { workspace = true }
flareite-workspace = { workspace = true }
getrandom = { workspace = true }
# `on-folder-contains` activation patterns (API 1.17).
globset = { workspace = true }
ignore = { workspace = true }
pulldown-cmark = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
wasmtime = { workspace = true }
wit-component = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wat = { workspace = true }

[lints]
workspace = true
