[package]
name = "flareite-schema"
description = "Schemas for configuration documents in Flareite: TOML Schema (.tosd) and JSON Schema validation, and what they say at a path, for completion and hover."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
flareite-schema-document = { workspace = true }
globset = { workspace = true }
# JSON Schema validation. No network or file access of its own: Flareite
# hands it every schema a reference needs.
jsonschema = { workspace = true }
regex = { workspace = true }
# JSON Schemas written in YAML.
saphyr-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The conformance corpus's harness.
regex = { workspace = true }

[lints]
workspace = true
