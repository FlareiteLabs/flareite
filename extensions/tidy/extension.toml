# Manifest of the example extension. See docs/extensions.md.
id = "example.tidy"
name = "Tidy"
version = "1.0.0"
description = "Flags trailing whitespace and overlong lines, and trims trailing whitespace in documents, files, and folders."
author = "Flareite"
icon = "icon.svg"
api_version = "2"
# Built by `cargo build --release` in extensions/. Installed extensions keep
# the .wasm file next to this manifest instead.
entrypoint = "../target/wasm32-unknown-unknown/release/tidy.wasm"
activation = ["on-startup"]

# Built in place while it's a development extension: when it's loaded, and
# again whenever a file in this folder changes (see docs/extensions.md).
[build]
command = "cargo"
args = ["build", "--release", "--package", "tidy"]

[engines]
flareite = ">=0.1.0"

[permissions]
documents_read = true
documents_write = true
# For trimming files and folders from the explorer.
files_read = true
files_write = true

[[commands]]
id = "example.tidy.trimTrailingWhitespace"
title = "Trim Trailing Whitespace"

[[commands]]
id = "example.tidy.countWords"
title = "Count Words"

[[commands]]
id = "example.tidy.trimFiles"
title = "Trim Trailing Whitespace in Files"

[[menus]]
location = "explorer/context"
command = "example.tidy.trimFiles"
targets = ["files", "folders"]
group = "tidy"

[configuration.max_line_length]
type = "integer"
default = 100
minimum = 0
description = "Lines longer than this many characters are flagged; 0 turns the check off."

[configuration.severity]
type = "string"
default = "warning"
choices = ["error", "warning", "information", "hint"]
description = "How problems are shown."
