# Used by the extension host's integration tests for the workspace,
# processes, terminals, and explorer interfaces, streamed and interactive
# output, downloads, secrets, password prompts, and language server folders.
id = "test.programs"
name = "Programs"
version = "0.1.0"
description = "Runs programs, watches files, and marks them in the explorer on request."
api_version = "2"
entrypoint = "../../target/wasm32-unknown-unknown/release/programs.wasm"
activation = ["on-startup"]
events = ["folder-changed"]

[permissions]
files_read = true
processes = true
network = true
language_servers = true

# Never started by the tests, which check the folders it's given.
[[language_servers]]
name = "folders-server"
command = "folders-server"
languages = ["plaintext"]

# Every test machine has the Rust compiler.
[[programs]]
name = "rustc"

[colors.modified]
description = "Changed files"
dark = "#e2c08d"
light = "#895503"

[[commands]]
id = "test.programs.run"
title = "Run a Program"

[[commands]]
id = "test.programs.unknown"
title = "Run an Undeclared Program"

[[commands]]
id = "test.programs.spawn"
title = "Start a Program"

[[commands]]
id = "test.programs.watch"
title = "Watch the Argument"

[[commands]]
id = "test.programs.mark"
title = "Mark the Argument"

[[commands]]
id = "test.programs.badMark"
title = "Mark with an Undeclared Color"

[[commands]]
id = "test.programs.stream"
title = "Start a Program, Streaming Its Output"

[[commands]]
id = "test.programs.interactive"
title = "Talk to a Program"

[[commands]]
id = "test.programs.notInteractive"
title = "Write to a Program Not Started Interactive"

[[commands]]
id = "test.programs.terminal"
title = "Run a Program in a Terminal"

[[commands]]
id = "test.programs.download"
title = "Download the Argument"

[[commands]]
id = "test.programs.secret"
title = "Set, Get, or List Secrets"

[[commands]]
id = "test.programs.password"
title = "Ask for a Password"

[[commands]]
id = "test.programs.serverFolders"
title = "Give the Language Server Folders"

