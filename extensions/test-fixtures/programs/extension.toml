# Used by the extension host's integration tests for the API 1.6
# interfaces: workspace, processes, and explorer; and for API 1.17's
# streamed output, downloads, secrets, and password prompts.
id = "test.programs"
name = "Programs"
version = "0.1.0"
description = "Runs programs, watches files, and marks them in the explorer on request."
api_version = "1"
entrypoint = "../../target/wasm32-unknown-unknown/release/programs.wasm"
activation = ["on-startup"]
on_folder_changed = "test.programs.folder"

[permissions]
files_read = true
processes = true
network = true

# Every test machine has the Rust compiler.
[[programs]]
name = "rustc"

[colors.modified]
description = "Changed files"
dark = "#e2c08d"
light = "#895503"

[[commands]]
id = "test.programs.run"
title = "Run a Program"

[[commands]]
id = "test.programs.unknown"
title = "Run an Undeclared Program"

[[commands]]
id = "test.programs.spawn"
title = "Start a Program"

[[commands]]
id = "test.programs.finished"
title = "Report a Finished Program"
hidden = true

[[commands]]
id = "test.programs.watch"
title = "Watch the Argument"

[[commands]]
id = "test.programs.changed"
title = "Report Changes"
hidden = true

[[commands]]
id = "test.programs.mark"
title = "Mark the Argument"

[[commands]]
id = "test.programs.badMark"
title = "Mark with an Undeclared Color"

[[commands]]
id = "test.programs.folder"
title = "Report the Folder"
hidden = true

[[commands]]
id = "test.programs.stream"
title = "Start a Program, Streaming Its Output"

[[commands]]
id = "test.programs.lines"
title = "Collect Lines"
hidden = true

[[commands]]
id = "test.programs.streamed"
title = "Report a Streamed Program"
hidden = true

[[commands]]
id = "test.programs.download"
title = "Download the Argument"

[[commands]]
id = "test.programs.downloaded"
title = "Report a Download"
hidden = true

[[commands]]
id = "test.programs.secret"
title = "Set, Get, or List Secrets"

[[commands]]
id = "test.programs.password"
title = "Ask for a Password"

[[commands]]
id = "test.programs.answered"
title = "Report an Answer's Kind"
hidden = true
