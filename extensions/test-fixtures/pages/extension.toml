# Used by the extension host's integration tests for previews (filled in
# with `workbench::render-markdown`), viewers, and webview pages.
id = "test.pages"
name = "Pages"
version = "0.1.0"
description = "Previews Markdown documents, and shows files in a webview that asks for their size."
api_version = "2"
entrypoint = "../../target/wasm32-unknown-unknown/release/pages.wasm"

[permissions]
documents_read = true

[[commands]]
id = "test.pages.preview"
title = "Open Preview"

[[commands]]
id = "test.pages.previewToSide"
title = "Open Preview to the Side"

[[previews]]
id = "preview"
icon = "book"

# The page loads the file itself; it asks the extension for the file's
# size with a message (`webview-message`).
[[viewers]]
id = "file"
title = "File Viewer"
patterns = ["*.png"]
webview = "media/viewer.html"
