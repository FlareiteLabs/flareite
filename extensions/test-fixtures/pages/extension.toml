# Used by the extension host's integration tests for previews (filled in
# with `workbench::render-markdown`), viewers, and webview pages.
id = "test.pages"
name = "Pages"
version = "0.1.0"
description = "Previews Markdown documents, and shows files in a webview that asks for their size."
api_version = "2"
entrypoint = "../../target/wasm32-unknown-unknown/release/pages.wasm"

[permissions]
documents_read = true

[[commands]]
id = "test.pages.preview"
title = "Open Preview"

[[commands]]
id = "test.pages.previewToSide"
title = "Open Preview to the Side"

# Problems in the file its argument names (2.2): one on its second line;
# `clearProblems` removes them.
[[commands]]
id = "test.pages.fileProblems"
title = "Report Problems in a File"

[[commands]]
id = "test.pages.clearProblems"
title = "Clear Problems in Files"

[[previews]]
id = "preview"
icon = "book"

# The page loads the file itself; it asks the extension for the file's
# size with a message (`webview-message`).
[[viewers]]
id = "file"
title = "File Viewer"
patterns = ["*.png"]
webview = "media/viewer.html"

# Changes its files (2.2), as the page asks: `edit`, `stale`, `undo`, and
# `read` messages.
[[viewers]]
id = "bytes"
title = "Byte Editor"
patterns = ["*.bin"]
webview = "media/viewer.html"
editable = true
