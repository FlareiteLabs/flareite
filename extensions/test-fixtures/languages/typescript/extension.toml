# A copy of the languages of the official flareite.typescript extension, for the
# editor's tests, which need real grammars. Not kept in step with it.
id = "test.typescript"
name = "TypeScript"
version = "0.1.0"
description = "TypeScript and TSX highlighting, and typescript-language-server."
author = "Flareite"
api_version = "2"

[engines]
flareite = ">=0.1.0"

[permissions]
language_servers = true

[[languages]]
id = "typescript"
name = "TypeScript"
file_extensions = ["ts", "mts", "cts"]
grammar = "grammars/tree-sitter-typescript.wasm"
highlights = "queries/typescript/highlights.scm"
folds = "queries/typescript/folds.scm"
line_comment = "//"
block_comment = ["/*", "*/"]
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["${", "}"], ["{", "}"], ["[", "]"], ["(", ")"]]
auto_closing_pairs = [
  ["{", "}"],
  ["[", "]"],
  ["(", ")"],
  { open = "'", close = "'", not_in = ["string", "comment"] },
  { open = '"', close = '"', not_in = ["string"] },
  { open = "`", close = "`", not_in = ["string", "comment"] },
  { open = "/**", close = " */", not_in = ["string"] },
]
surrounding_pairs = [["{", "}"], ["[", "]"], ["(", ")"], ["'", "'"], ['"', '"'], ["`", "`"], ["<", ">"]]
auto_close_before = ";:.,=}])>`"

[[languages]]
# The LSP id for TSX.
id = "typescriptreact"
name = "TypeScript JSX"
file_extensions = ["tsx"]
grammar = "grammars/tree-sitter-tsx.wasm"
grammar_name = "tsx"
highlights = "queries/tsx/highlights.scm"
folds = "queries/tsx/folds.scm"
line_comment = "//"
block_comment = ["/*", "*/"]
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["${", "}"], ["{", "}"], ["[", "]"], ["(", ")"]]
auto_closing_pairs = [
  ["{", "}"],
  ["[", "]"],
  ["(", ")"],
  { open = "'", close = "'", not_in = ["string", "comment"] },
  { open = '"', close = '"', not_in = ["string"] },
  { open = "`", close = "`", not_in = ["string", "comment"] },
  { open = "/**", close = " */", not_in = ["string"] },
]
surrounding_pairs = [["{", "}"], ["[", "]"], ["(", ")"], ["'", "'"], ['"', '"'], ["`", "`"], ["<", ">"]]
auto_close_before = ";:.,=}])>`"

# `npm install -g typescript-language-server typescript`. The JavaScript
# extension declares the same server for JavaScript; one runs for both.
[[language_servers]]
name = "typescript-language-server"
command = "typescript-language-server"
args = ["--stdio"]
languages = ["typescript", "typescriptreact"]
root_markers = ["tsconfig.json", "jsconfig.json", "package.json"]
