# A copy of the languages of the official flareite.html-css extension, for the
# editor's tests, which need real grammars. Not kept in step with it.
id = "test.html-css"
name = "HTML & CSS"
version = "0.1.0"
description = "HTML, CSS and SVG: highlighting (with CSS and JavaScript inside HTML and SVG) and language servers."
author = "Flareite"
api_version = "1"

[engines]
flareite = ">=0.1.0"

# Flareite starts the servers below only once you allow this.
[permissions]
language_servers = true

[[languages]]
# The id language servers, settings, and injections use.
id = "html"
name = "HTML"
file_extensions = ["html", "htm", "xhtml"]
# Built with `tree-sitter build --wasm`; exports `tree_sitter_html`.
grammar = "grammars/tree-sitter-html.wasm"
highlights = "queries/html/highlights.scm"
folds = "queries/html/folds.scm"
# Highlights <style> as CSS and <script> as JavaScript.
injections = "queries/html/injections.scm"
# No line comments: Toggle Line Comment wraps lines in a block comment.
block_comment = ["<!--", "-->"]
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["<!--", "-->"], ["{", "}"], ["(", ")"]]
auto_closing_pairs = [
  ["{", "}"],
  ["[", "]"],
  ["(", ")"],
  ["'", "'"],
  ['"', '"'],
  { open = "<!--", close = "-->", not_in = ["string", "comment"] },
]
surrounding_pairs = [["'", "'"], ['"', '"'], ["{", "}"], ["[", "]"], ["(", ")"], ["<", ">"]]

[[languages]]
id = "css"
name = "CSS"
file_extensions = ["css"]
grammar = "grammars/tree-sitter-css.wasm"
highlights = "queries/css/highlights.scm"
folds = "queries/css/folds.scm"
block_comment = ["/*", "*/"]
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["{", "}"], ["[", "]"], ["(", ")"]]
auto_closing_pairs = [
  { open = "{", close = "}", not_in = ["string", "comment"] },
  { open = "[", close = "]", not_in = ["string", "comment"] },
  { open = "(", close = ")", not_in = ["string", "comment"] },
  { open = '"', close = '"', not_in = ["string", "comment"] },
  { open = "'", close = "'", not_in = ["string", "comment"] },
]
surrounding_pairs = [["{", "}"], ["[", "]"], ["(", ")"], ['"', '"'], ["'", "'"]]

[[languages]]
id = "svg"
name = "SVG"
file_extensions = ["svg"]
# SVG is XML: the prebuilt tree-sitter-xml grammar, which exports
# `tree_sitter_xml`.
grammar = "grammars/tree-sitter-xml.wasm"
grammar_name = "xml"
highlights = "queries/svg/highlights.scm"
folds = "queries/svg/folds.scm"
# Highlights <style> as CSS and <script> as JavaScript.
injections = "queries/svg/injections.scm"
block_comment = ["<!--", "-->"]
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["<!--", "-->"], ["{", "}"], ["(", ")"]]
auto_closing_pairs = [
  ["{", "}"],
  ["[", "]"],
  ["(", ")"],
  { open = "'", close = "'", not_in = ["string", "comment"] },
  { open = '"', close = '"', not_in = ["string", "comment"] },
  { open = "<!--", close = "-->", not_in = ["string", "comment"] },
]
surrounding_pairs = [["{", "}"], ["[", "]"], ["(", ")"], ["'", "'"], ['"', '"'], ["<", ">"]]

# `npm install -g vscode-langservers-extracted` provides both servers. Flareite
# looks for them on the PATH and shows "not installed" in the status bar if
# they're missing; highlighting works either way.
[[language_servers]]
name = "vscode-html-language-server"
command = "vscode-html-language-server"
args = ["--stdio"]
languages = ["html"]
root_markers = ["package.json"]

[[language_servers]]
name = "vscode-css-language-server"
command = "vscode-css-language-server"
args = ["--stdio"]
languages = ["css"]
root_markers = ["package.json"]
