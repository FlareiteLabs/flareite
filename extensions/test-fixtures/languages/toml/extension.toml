# A copy of the languages of the official flareite.toml extension, for the
# editor's tests, which need real grammars. Not kept in step with it.
id = "test.toml"
name = "TOML"
version = "0.1.0"
description = "TOML highlighting."
author = "Flareite"
api_version = "1"

[engines]
flareite = ">=0.1.0"

[[languages]]
id = "toml"
name = "TOML"
file_extensions = ["toml", "tosd"]
file_names = ["Cargo.lock"]
grammar = "grammars/tree-sitter-toml.wasm"
highlights = "queries/highlights.scm"
folds = "queries/folds.scm"
line_comment = "#"
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["{", "}"], ["[", "]"]]
auto_closing_pairs = [
  ["{", "}"],
  ["[", "]"],
  { open = '"', close = '"', not_in = ["string", "comment"] },
  { open = "'", close = "'", not_in = ["string", "comment"] },
]
